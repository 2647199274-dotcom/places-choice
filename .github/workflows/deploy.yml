name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 在 Linux runner 上重新编译；本项目导出数据集时若数据库不可用会自动回退种子数据
      - run: npm ci

      # 导出静态数据集（Pages 上没有后端，前端靠这个文件取数据）
      - name: Export static dataset
        run: node scripts/export-static-dataset.mjs

      # 部署在子路径 /<repo>/ 下，base 必须与仓库名一致，否则资源 404 白屏
      - name: Build web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:web

      # SPA 回退：GitHub Pages 没有 rewrite，用 404.html 兜住深链接
      - name: SPA fallback
        run: cp web/dist/index.html web/dist/404.html

      # 关掉 Jekyll，避免忽略下划线开头的资源
      - name: Disable Jekyll
        run: touch web/dist/.nojekyll

      - name: Diagnostic
        run: |
          echo "--- dist ---"; ls -la web/dist
          echo "--- data ---"; ls -la web/dist/data
          echo "--- base check ---"; head -c 400 web/dist/index.html

      # enablement: true 让工作流尝试自动把 Pages 源设为 GitHub Actions。
      # 注意：个人账号仓库**不支持**自助开启（只有组织仓库可以），此时这一步会失败，
      # 需要仓库主在 Settings → Pages → Source 选 "GitHub Actions" 一次。
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Pages 未启用时给出明确指引
        run: |
          echo "::group::部署前检查"
          echo "如果后面的 upload-pages-artifact / deploy-pages 报 'Get Pages site failed'，"
          echo "说明仓库还没启用 Pages（个人账号仓库不支持工作流自助开启）。请打开："
          echo "  https://github.com/${{ github.repository }}/settings/pages"
          echo "把 Source 选为 'GitHub Actions'，然后重新运行本工作流即可。"
          echo "::endgroup::"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
