name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 在 Linux runner 上重新编译（本项目线上构建不需要数据库，见下一步说明）
      - run: npm ci

      # ⚠️ 这里**故意不重新导出数据集**，直接用仓库里已提交的快照（web/public/data/dataset.json）。
      # 原因（真实事故）：data/*.db 是 gitignore 的，CI 上 openDb() 会**新建空数据库**而不是返回 null，
      # 于是 ensureSeeded() 灌进 647 条种子数据、被当成 "source: sqlite" 的真实数据导出，
      # 覆盖掉仓库里 25820 条的快照 → 线上只剩 671 条 / 11 城（浙江种子），且界面上看不出异常。
      # 正确做法：在有真实数据库的机器上跑 npm run export:static，提交快照，CI 只用不写。
      - name: Verify static dataset
        run: node scripts/verify-static-dataset.mjs

      # 部署在子路径 /<repo>/ 下，base 必须与仓库名一致，否则资源 404 白屏
      - name: Build web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:web

      # ⚠️ 这里**故意不再**把 index.html 复制成 404.html。
      # 404.html 现在是 web/public/404.html（独立最小页面），会被 Vite 原样放进 dist。
      # 为什么不能覆盖成 index.html：Cloudflare Pages 的规则是"没有顶层 404.html 就按单页应用处理，
      # 把未命中路径全部回落成 200 + index.html"，而前端靠 /api/dataset 返回 **404** 来判断"没有后端"。
      # 覆盖成 index.html 会让 200 行为在别的平台上复现（前端拿到 HTML 当 JSON，静默判成在线）。
      # GitHub Pages 只要 404.html 存在就会返回 404 状态，不必替换内容。

      # 关掉 Jekyll，避免忽略下划线开头的资源
      - name: Disable Jekyll
        run: touch web/dist/.nojekyll

      - name: Diagnostic
        run: |
          echo "--- dist ---"; ls -la web/dist
          echo "--- data ---"; ls -la web/dist/data
          echo "--- base check ---"; head -c 400 web/dist/index.html

      # enablement: true 让工作流尝试自动把 Pages 源设为 GitHub Actions。
      # 注意：个人账号仓库**不支持**自助开启（只有组织仓库可以），此时这一步会失败，
      # 需要仓库主在 Settings → Pages → Source 选 "GitHub Actions" 一次。
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Pages 未启用时给出明确指引
        run: |
          echo "::group::部署前检查"
          echo "如果后面的 upload-pages-artifact / deploy-pages 报 'Get Pages site failed'，"
          echo "说明仓库还没启用 Pages（个人账号仓库不支持工作流自助开启）。请打开："
          echo "  https://github.com/${{ github.repository }}/settings/pages"
          echo "把 Source 选为 'GitHub Actions'，然后重新运行本工作流即可。"
          echo "::endgroup::"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
