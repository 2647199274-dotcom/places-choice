<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>页面不存在 · 出去玩 · 地点选择转盘</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #f6f7fb; color: #1f2430; padding: 24px;
      }
      main { max-width: 30rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.25rem; color: #5b6472; }
      a {
        display: inline-block; padding: .6rem 1.25rem; border-radius: 999px;
        background: #3b6ef6; color: #fff; text-decoration: none; font-weight: 600;
      }
      a:hover { background: #2f5cdb; }
      @media (prefers-color-scheme: dark) {
        body { background: #14171d; color: #eef1f6; }
        p { color: #a2acbd; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>这个页面不存在</h1>
      <p>地址可能输错了，或者页面已经搬家。</p>
      <a href="./">回到转盘</a>
    </main>
  </body>
</html>
