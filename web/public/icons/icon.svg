  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 转盘扇区 -->
  <g transform="translate(256 256)">
    <circle r="168" fill="url(#brand)" opacity="0.95"/>
    <path d="M0 0 L0 -168 A168 168 0 0 1 145.5 -84 Z" fill="#ff6b6b"/>
    <path d="M0 0 L145.5 -84 A168 168 0 0 1 145.5 84 Z" fill="#ffd43b"/>
    <path d="M0 0 L145.5 84 A168 168 0 0 1 0 168 Z" fill="#51cf66"/>
