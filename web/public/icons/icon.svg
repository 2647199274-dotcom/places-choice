    <path d="M0 0 L-145.5 -84 A168 168 0 0 1 0 -168 Z" fill="#38d9a9"/>
    <g stroke="#0b0e1f" stroke-width="6">
      <line x1="0" y1="0" x2="0" y2="-168"/>
      <line x1="0" y1="0" x2="145.5" y2="-84"/>
      <line x1="0" y1="0" x2="145.5" y2="84"/>
      <line x1="0" y1="0" x2="0" y2="168"/>
